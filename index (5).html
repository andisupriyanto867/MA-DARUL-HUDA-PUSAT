<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keuangan Sekolah</title>
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keuangan Sekolah">
<link rel="manifest" id="manifestLink" href="">
<link rel="apple-touch-icon" id="appleIcon" href="">
<link rel="icon" id="favIcon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8ff;--card:#fff;--ink:#1e293b;--mut:#64748b;--line:#e1ebf8;--pri:#2563eb;--pri2:#0ea5e9;--pri-bg:#dbeafe;--ok:#059669;--ok-bg:#d1fae5;--warn:#d97706;--warn-bg:#fef3c7;--bad:#dc2626;--bad-bg:#fee2e2;--sh:0 1px 3px rgba(37,99,235,.06),0 8px 24px rgba(37,99,235,.08);--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14.5px;line-height:1.45;color:var(--ink);background:linear-gradient(180deg,#e3efff 0,#f3f8ff 320px) fixed;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0}
input,select{font:inherit;color:var(--ink)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;box-shadow:0 6px 16px rgba(37,99,235,.3)}
.brand b{display:block;font-size:16px;letter-spacing:-.01em}
.brand small{color:var(--mut);font-size:11.5px;font-weight:600}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:12px;background:none;color:var(--mut);font-weight:700;text-align:left;transition:.2s}
.nv:hover{background:#f1f6ff;color:var(--ink)}
.nv.on{background:var(--pri-bg);color:var(--pri)}
.nvsep{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:#94a3b8;padding:12px 14px 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:11px;font-weight:700;transition:transform .15s var(--ease),box-shadow .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.28)}
.btn-pri:hover{box-shadow:0 8px 22px rgba(37,99,235,.38)}
.btn-soft{background:var(--pri-bg);color:var(--pri)}
.btn-soft:hover{background:#c9dcfc}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--pri);color:var(--pri)}
.btn-bad{background:var(--bad-bg);color:var(--bad)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(243,248,255,.9);backdrop-filter:blur(10px);display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psel{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px 6px 4px 12px}
.psel span{font-size:11.5px;font-weight:700;color:var(--mut)}
.psel select{border:0;background:none;font-weight:800;padding:6px 4px;outline:none;max-width:170px;width:auto}
#st{font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;background:#eef3fb;color:var(--mut);white-space:nowrap}
#st.ok{background:var(--ok-bg);color:var(--ok)}#st.warn{background:var(--warn-bg);color:var(--warn)}
.page{padding:24px 28px 60px;max-width:1200px;animation:fade .4s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.ph p{margin:3px 0 0;color:var(--mut);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px;font-weight:800}
.stepbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stepbar .sb{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:6px 14px 6px 7px;font-weight:700;color:var(--mut);font-size:13px}
.stepbar .sb i{width:24px;height:24px;border-radius:50%;background:#eef3fb;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.stepbar .sb.on{border-color:var(--pri);color:var(--pri);background:var(--pri-bg)}
.stepbar .sb.on i{background:var(--pri);color:#fff}
.stepbar .sb.done i{background:var(--ok);color:#fff}.stepbar .sb.done{color:var(--ok)}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fs{position:relative;text-align:left;background:#f7faff;border:2px solid var(--line);border-radius:16px;padding:14px;transition:.2s;color:var(--ink)}
.fs:hover{transform:translateY(-2px);border-color:var(--pri)}
.fs .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:#e5ecf7;color:var(--mut);margin-bottom:8px}
.fs b{display:block;font-size:14px}.fs small{color:var(--mut);font-weight:600;font-size:12.5px}
.fs.done{background:var(--ok-bg);border-color:#a7e8cd}.fs.done .n{background:var(--ok);color:#fff}
.fs.now{background:var(--pri-bg);border-color:var(--pri)}.fs.now .n{background:var(--pri);color:#fff;box-shadow:0 0 0 5px rgba(37,99,235,.18)}
.fs .tag{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:800;background:var(--pri);color:#fff;border-radius:99px;padding:2px 9px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:#92560a;border-radius:14px;padding:12px 14px;font-weight:600;margin-bottom:14px}
.alert.info{background:var(--pri-bg);color:#1d4ed8}
.alert svg{flex:none;margin-top:1px}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;transition:.2s}
input:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px var(--pri-bg)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.sr{position:relative;flex:1;min-width:200px;max-width:380px}
.sr svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.sr input{padding-left:38px}
.tblw{overflow-x:auto;padding:10px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;min-width:560px}
.tbl th{background:#e8f0fd;color:#475a78;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:11px 10px;white-space:nowrap}
.tbl th:first-child{border-radius:10px 0 0 10px}.tbl th:last-child{border-radius:0 10px 10px 0}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover td{background:#f8fbff}
.tbl .r,.tbl th.r{text-align:right}.tbl .c,.tbl th.c{text-align:center}
.tbl tfoot td{font-weight:800;background:#e8f0fd;border-bottom:0;padding:11px 10px}
.tbl tfoot td:first-child{border-radius:10px 0 0 10px}.tbl tfoot td:last-child{border-radius:0 10px 10px 0}
.tbl .ac{width:104px;text-align:right;padding:4px 6px;white-space:nowrap}
.tbl .ac .btn{display:inline-flex;vertical-align:middle}
.tbl.edit tr.editing td{background:#eef5ff}
.tbl td.vt{font-weight:700}
.btn-ok{background:var(--ok);color:#fff}
.tbl.edit{min-width:680px}
.tbl.edit td{padding:4px 5px}
.tbl.edit td.c{color:var(--mut);font-weight:700}
input.cell,input.kcell{width:100%;min-width:0;padding:9px 10px;border:1.5px solid transparent;background:#f6f9ff;border-radius:8px;font-weight:600;box-shadow:none}
input.cell:hover,input.kcell:hover{border-color:#cfdcf2}
input.cell:focus,input.kcell:focus{background:#fff;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-bg)}
input[type=number].cell,input[type=number].kcell{text-align:right;-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.cell::placeholder,input.kcell::placeholder{color:#a9b7cc;font-weight:500}
td.calc{font-weight:800;text-align:right;white-space:nowrap;color:var(--ok)}
.kt{display:inline-block;font-size:11.5px;font-weight:800;color:var(--c);background:var(--b);border-radius:99px;padding:2px 10px;white-space:nowrap}
.mn{color:var(--ok);font-weight:800}
.empty{text-align:center;padding:36px 16px;color:var(--mut);font-weight:600}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.legend{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.legend button{display:flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:700;font-size:12.5px;color:var(--ink)}
.legend button i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.legend button.on{background:var(--b);border-color:var(--c);color:var(--c)}
.slipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.slipwrap{display:flex;flex-direction:column;gap:8px}
.slipwrap .slip{min-height:340px}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:5px}
.fld small{display:block;color:var(--mut);font-size:11.5px;margin-top:4px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#modal{position:fixed;inset:0;z-index:50;background:rgba(30,64,130,.35);backdrop-filter:blur(4px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s}
#modal.show{opacity:1;pointer-events:auto}
.mbox{background:#fff;width:min(520px,94vw);max-height:90vh;overflow:auto;border-radius:22px;padding:22px;box-shadow:0 24px 70px rgba(15,40,100,.35);transform:translateY(14px) scale(.97);transition:transform .35s var(--ease)}
#modal.show .mbox{transform:none}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.mh h3{margin:0;font-size:18px}.mh p{margin:2px 0 0;color:var(--mut);font-size:13px;font-weight:600}
.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1e293b;color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.3s var(--ease);z-index:99;max-width:92%}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{background:var(--bad)}
.bnav{display:none}
/* slip */
.slip{background:#fff;border:2px solid var(--c);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;font-size:12px;height:100%;color:#1e293b;font-family:'Plus Jakarta Sans',Arial,sans-serif}
.sl-h{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;padding:9px 12px;text-align:center;position:relative}
.sl-logo{position:absolute;left:9px;top:7px;width:36px;height:36px;object-fit:contain;background:#fff;border-radius:50%;padding:2px;box-sizing:border-box}
.slipsheet .sl-logo{width:27px;height:27px;left:7px;top:4px}
.lg-fb{display:inline-grid;place-items:center;font-weight:800;color:#1e3a8a;background:#fff}.sl-logo.lg-fb{font-size:11px}.dlogo.lg-fb{border:1px solid #000;font-size:18px}.logo .lg-fb{width:100%;height:100%;font-size:15px;border-radius:9px}
.logo.lg-img{background:#fff;padding:3px;box-shadow:0 4px 12px rgba(15,23,42,.15)}.logo img{width:100%;height:100%;object-fit:contain;border-radius:9px}
.dok .dtop{position:relative;min-height:17mm}.dok .dlogo{position:absolute;left:0;top:0;width:17mm;height:17mm;object-fit:contain}
.btn-wa2{background:#fff;color:#15803d;border:1.5px solid #22c55e}.btn-wa2:hover{background:#f0fdf4}
.btn-wa{background:#22c55e;color:#fff}.btn-wa:hover{background:#16a34a}
.rstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.rstat .c{border-radius:16px;padding:16px;color:#fff}.rstat .c small{display:block;font-weight:700;opacity:.92;font-size:12.5px}.rstat .c b{display:block;font-size:22px;margin-top:4px;white-space:nowrap}
.rstat .in{background:linear-gradient(135deg,#17c07a,#0e9f6e)}.rstat .out{background:linear-gradient(135deg,#ff8a5c,#e5383b)}.rstat .sal{background:linear-gradient(135deg,#2563eb,#0ea5e9)}
.tbl .pos{color:#15803d;font-weight:700}.tbl .neg{color:#dc2626;font-weight:700}
@media(max-width:700px){.tbl.tb-rc{table-layout:auto}.tbl.tb-rc th:nth-child(n+2),.tbl.tb-rc td:nth-child(n+2){width:1%!important}.tbl.tb-rc td:first-child,.tbl.tb-rc th:first-child{width:auto!important;text-align:left;padding-left:4px}.rstat{grid-template-columns:1fr 1fr}.rstat .sal{grid-column:1/-1}.rstat .c{padding:12px}.rstat .c b{font-size:16px}.rstat .c b{font-size:19px}}
.sl-r tr.ln td:last-child{color:#15803d;font-weight:700}.sl-r tr.pot td:last-child{color:#dc2626;font-weight:700}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid #b6c6e3;background:#fff;color:#fff;font-weight:900;font-size:15px;line-height:1;cursor:pointer;padding:0}.chk.on{background:var(--ok);border-color:var(--ok)}
small.ket{display:block;color:var(--mut);font-weight:600;font-size:11px}
@media(max-width:700px){.tb-ln th:nth-child(3),.tb-ln td:nth-child(3){width:34px!important}.tb-ln th:nth-child(4),.tb-ln td:nth-child(4),.tb-ln th:nth-child(5),.tb-ln td:nth-child(5){width:6.6em!important}.tb-ln .ac{width:34px!important}.chk{width:24px;height:24px;font-size:13px}}
.sg,.sp{position:relative}
.sl-f .sg:has(.ttd-img){height:34px}
.ttd-img{position:absolute;right:4px;bottom:-2px;height:34px;max-width:110px;object-fit:contain;pointer-events:none}
.slipsheet .ttd-img{height:22px;max-width:80px;bottom:-1px}
.slipsheet .sl-f .sg:has(.ttd-img){height:20px}
.dok .sp{position:relative}.dok .ttd-img{height:15mm;max-width:40mm;left:0;right:auto;bottom:0}
.ttdbox canvas{display:block;width:100%;height:170px;border:2px dashed #b6c6e3;border-radius:14px;background:#fff;touch-action:none;cursor:crosshair}
.ttdbox .acts{margin-top:10px}
.is-app .inst{display:none!important}
.logoset{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.logoset img{width:84px;height:84px;object-fit:contain;border:1px solid #dbe4f0;border-radius:14px;background:#fff;padding:6px}
.sl-school{font-size:10.5px;font-weight:700;letter-spacing:.05em;opacity:.95}
.sl-t{font-size:17px;font-weight:800;letter-spacing:.14em}
.sl-p{font-size:10.5px;font-weight:700;background:rgba(255,255,255,.25);display:inline-block;padding:2px 11px;border-radius:99px;margin-top:3px}
.sl-who{background:var(--b);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sl-who b{font-size:12.5px}
.sl-chip{background:var(--c);color:#fff;font-size:9.5px;font-weight:800;padding:2px 9px;border-radius:99px;white-space:nowrap}
.sl-body{flex:1;padding:4px 0}
.sl-r{width:100%;border-collapse:collapse}
.sl-r td{padding:5px 12px;font-size:11.5px;border-bottom:1px dashed var(--b2)}
.sl-r td:last-child{text-align:right;font-weight:800;white-space:nowrap}
.sl-r small{display:block;color:#64748b;font-size:9.5px;font-weight:600}
.sl-tot{margin:0 12px;display:flex;justify-content:space-between;align-items:center;background:var(--b);border:1.5px solid var(--c);border-radius:10px;padding:7px 11px;font-weight:800;color:var(--c)}
.sl-tot b{font-size:14px}
.sl-f{padding:6px 12px 9px;text-align:right;font-size:10px;color:#475569;line-height:1.35}
.sl-f .sg{height:20px}
#printArea{display:none}
.dok{font-family:Arial,Helvetica,sans-serif;color:#000;font-size:11px}
.dok h4{margin:0;text-align:center;font-size:13px;line-height:1.4}
.dok table{width:100%;border-collapse:collapse;margin-top:10px}
.dok th,.dok td{border:1px solid #000;padding:5px 6px}
.dok th{text-align:center;background:#dbeafe}
.dok td.c{text-align:center}
.dok .rpc{display:flex;justify-content:space-between;gap:12px}
.dok .ttd{width:22%}.dok .ttd div.l{text-align:left}.dok .ttd div.rr{text-align:right;padding-right:10px}
.dok tfoot td{font-weight:700;background:#eff6ff}
.dok .sig{display:flex;justify-content:space-between;margin-top:16px;padding:0 10mm;line-height:1.4}
.dok .sig .sp{height:54px}
.slipsheet{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:4mm}
.pg.cap{width:210mm;height:297mm;padding:8mm;box-sizing:border-box;background:#fff}
.slipsheet .slip{height:auto;min-height:0;font-size:10px;border-width:1.5px;border-radius:10px}
.slipsheet .sl-h{padding:5px 10px}.slipsheet .sl-t{font-size:14px}.slipsheet .sl-school{font-size:9px}
.slipsheet .sl-p{font-size:9px;padding:1px 9px;margin-top:2px}
.slipsheet .sl-who{padding:5px 10px}.slipsheet .sl-who b{font-size:10.5px;line-height:1.2}.slipsheet .sl-chip{font-size:8px}
.slipsheet .sl-r td{padding:3px 10px;font-size:10px}.slipsheet .sl-r small{font-size:8px}
.slipsheet .sl-tot{margin:0 10px;padding:5px 9px}.slipsheet .sl-tot b{font-size:12px}
.slipsheet .sl-f{padding:3px 10px 6px;font-size:8.5px}.slipsheet .sl-f .sg{height:14px}
.slipsheet .lainx .sl-body{padding:1px 0}.slipsheet .lainx .sl-r td{padding:1.5px 10px}
.slipsheet .lainx .sl-r tr.ln small,.slipsheet .lainx .sl-r tr.pot small{display:inline;margin-left:4px;font-size:7.5px}
.slipsheet .lainx .sl-tot{padding:3px 9px}.slipsheet .lainx .sl-f{padding:2px 10px 3px}.slipsheet .lainx .sl-f .sg{height:6px}
.slipsheet .lainx .sl-who{padding:3px 10px}
@media print{
 @page{size:A4;margin:8mm}
 html,body{background:#fff!important}
 .app,.bnav,#toast,#modal,#ov{display:none!important}
 #printArea{display:block}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .pg{break-after:page;page-break-after:always;height:279mm}
 .pg:last-child{break-after:auto;page-break-after:auto}
 .pg.dok{height:auto}
 .slip{break-inside:avoid}
}
@media(max-width:1100px){.flow{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
 .app{grid-template-columns:1fr}.side{display:none}
 .topbar{padding:10px 14px;flex-wrap:wrap}.topbar h1{font-size:17px;flex:1 1 100%;order:-1}
 .page{padding:16px 14px 100px}
 .bnav{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(30,80,160,.14);padding:8px 2px calc(8px + env(safe-area-inset-bottom))}
 .bnav button{background:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:9.5px;font-weight:700;padding:4px 0}
 .bnav button.on{color:var(--pri)}
 .bnav button.on svg{transform:translateY(-2px) scale(1.12)}
 .bnav svg{transition:.25s var(--ease)}
 .psel select{max-width:120px}
}
@media(max-width:700px){
 .tblw{overflow-x:visible}
 .tbl,.tbl.edit{min-width:0!important;table-layout:fixed;width:100%;font-size:10.5px}

}
/* simpan tanpa menggambar ulang layar (dipakai saat mengetik di tabel) */
function pushPath(path, val) {

  if (root) return root.child(path).set(val).catch(e => toast('Gagal menyimpan ke server: ' + e.message, true));
}
/* simpan lalu gambar ulang layar (tambah/hapus baris, dll) */

function dbAll(tree) {

}
function startFB() {
  loadLocal();

    firebase.initializeApp(firebaseConfig);
    root = firebase.database().ref(DB_PATH);
    root.on('value', s => {
      const v = s.val(); got = true; fbErr = '';
      if (!v || (!v.seeded && !Object.keys(v.periode || {}).length)) {
        if (!seeding) { seeding = true; const ada = Object.keys(S.periode).length > 0 || Object.keys(S.kas).length > 0, t = ada ? {...S, seeded:true} : seedTree(); S = norm(t); saveLocal(); render(); root.update(clean(t)).catch(e => toast('Data awal belum bisa dikirim ke server: ' + e.message, true)); }
        return;
      }
      setSt();
      const nv = norm(v);
      if (sj(nv) === sj(S)) return;           // data sama dengan yang di layar: tidak perlu gambar ulang
      S = nv; saveLocal(); render();
    }, e => { fbErr = e.message; setSt(); });
    firebase.database().ref('.info/connected').on('value', s => { conn = !!s.val(); setSt(); });
  } catch (e) { root = null; }

  setSt(); render();
}

    openModal({title:'Hapus periode ' + p.nama + '?', sub:'Tindakan ini tidak bisa dibatalkan', saveLabel:'Ya, hapus periode', danger:true,
      body:`<div class="alert" style="background:var(--bad-bg);color:#991b1b">${ic('warn')}<div><b>Peringatan!</b> Seluruh data periode <b>${esc(p.nama)}</b> akan terhapus permanen: tabel <b>KBM</b>, tabel <b>Tunjab</b>, dan <b>slip gaji</b> (${R.length} guru, total ${rp(sum(R, tot))}).<br>Catatan <b>Kas</b> tidak ikut terhapus.</div></div>`,
      onSave() {
        pushPath('periode/' + p.id, null);
        if (aktifId === p.id) { aktifId = ''; try { localStorage.removeItem('ks-aktif'); } catch (e) {} }
        editing.kbm.clear(); editing.tunjab.clear(); editing.lain.clear(); toast('Periode ' + p.nama + ' dihapus'); render();
      }});
  }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act],[data-kat]'); if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.kat !== undefined) { Q.kat = Q.kat === t.dataset.kat ? '' : t.dataset.kat; return render(); }
  const a = ACT[t.dataset.act]; if (a) a(t.dataset.id, t);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.q) { Q[t.dataset.q] = t.value; render(); }
  else if (t.dataset && t.dataset.kf) { const [i, f] = t.dataset.kf.split('|'), r = formRows(kasTab)[+i]; if (r) r[f] = t.value; }
  else if (t.classList.contains('cell')) onCell(t, false);
});
document.addEventListener('change', e => {
  const t = e.target, c = t.dataset && t.dataset.change;
  if (c === 'psel') setAktif(t.value);
  else if (c === 'rowsN') { Q.rowsN = +t.value; try { localStorage.setItem('ks-rows', Q.rowsN); } catch (x) {} render(); }
  else if (t.classList.contains('cell')) onCell(t, true);
});
/* Enter = pindah ke baris bawah pada kolom yang sama; di baris terakhir menambah baris baru */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const t = e.target; if (!t.matches || !t.matches('input.cell,input.kcell')) return;
  e.preventDefault();
  const f = t.dataset.f, isK = t.classList.contains('kcell'); const cur = t.closest('tr'), last = !cur.nextElementSibling; let tr = cur.nextElementSibling;
  t.blur();
  while (tr && !tr.querySelector('[data-f="' + f + '"]')) tr = tr.nextElementSibling;
  if (tr) { const n = tr.querySelector('[data-f="' + f + '"]'); n.focus(); if (n.select) n.select(); }
  else if (last) ACT[isK ? 'kas-add' : 'row-add']();
});
$('#impFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const v = JSON.parse(r.result); if (!v.periode) throw new Error('format tidak dikenali'); if (confirm('Pulihkan data dari cadangan ini? Data saat ini akan diganti.')) { aktifId = ''; dbAll({...v, seeded:true}); toast('Cadangan dipulihkan'); } } catch (x) { toast('File cadangan tidak valid: ' + x.message, true); } };
  r.readAsText(f); e.target.value = '';
});

/* ================= PWA ================= */
function buatIkon(size) {
  const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
  if (LOGO_IMG) {
    x.fillStyle = '#fff'; x.fillRect(0, 0, size, size);
    const w0 = LOGO_IMG.naturalWidth, h0 = LOGO_IMG.naturalHeight, r = size * 0.8 / Math.max(w0, h0), w = w0 * r, h = h0 * r;
    x.drawImage(LOGO_IMG, (size - w) / 2, (size - h) / 2, w, h); return c.toDataURL('image/png');
  }
  const g = x.createLinearGradient(0, 0, size, size); g.addColorStop(0, '#2563eb'); g.addColorStop(1, '#0ea5e9');
  x.fillStyle = g; x.fillRect(0, 0, size, size); x.fillStyle = '#fff'; x.font = '800 ' + size * 0.4 + 'px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('KS', size / 2, size / 2 + size * 0.02);
  return c.toDataURL('image/png');
}
let swDone = false;
function setupPWA() {
  try {
    const i192 = buatIkon(192), i512 = buatIkon(512); $('#appleIcon').href = i192; $('#favIcon').href = i192;
    const manifest = {name:'Keuangan Sekolah', short_name:'Keuangan Sekolah', description:'Honor KBM, tunjangan jabatan, slip gaji, dan kas sekolah', start_url:'.', scope:'.', display:'standalone', background_color:'#f3f8ff', theme_color:'#2563eb',
      icons:[{src:i192, sizes:'192x192', type:'image/png', purpose:'any maskable'}, {src:i512, sizes:'512x512', type:'image/png', purpose:'any maskable'}]};
    $('#manifestLink').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'}));
    if ('serviceWorker' in navigator && !swDone) { swDone = true; navigator.serviceWorker.register('sw.js').catch(() => {}); }
  } catch (e) {}
}
let promptInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); promptInstall = e; });
window.addEventListener('appinstalled', () => { promptInstall = null; document.documentElement.classList.add('is-app'); });
if ((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone) document.documentElement.classList.add('is-app');

/* ================= JAM & TANGGAL OTOMATIS ================= */
function tickClock() {
  const el = $('#clock'); if (!el) return;
  const n = new Date(), tz = ({7:'WIB', 8:'WITA', 9:'WIT'})[-n.getTimezoneOffset() / 60] || '';
  el.querySelector('.cl-d').textContent = n.toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  el.querySelector('.cl-t').textContent = n.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false}).replace(/\./g, ':') + (tz ? ' ' + tz : '');
}
tickClock(); setInterval(tickClock, 1000);

/* ================= MULAI ================= */
buildShell();
route = location.hash.slice(1); if (!PAGES[route]) route = 'beranda';
$('#topInstall').innerHTML = ic('download', 15) + '<span>Instal Aplikasi</span>';
applyLogo(); loadLogo(); startFB();
</script>
